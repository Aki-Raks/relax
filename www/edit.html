<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Редактировать список</title>
  <link rel="icon" type="image/png" href="/favicon.png">  
  <link rel="stylesheet" href="/resources/style.css">  
</head>
<body>
  <div class="card create-card">
    <h2>Редактирование</h2>
    <div class="form-group">
      <label for="theme-select">Выберите тему для изменения</label>
      <select id="theme-select" class="select-box">
      </select>
    </div>
    <div id="edit-content" class="edit-content">      
      <div class="form-group">
        <label for="theme-input">Название темы</label>
        <input type="text" id="theme-input" class="input-box">
      </div>
      <div class="form-group">
        <label>Пункты на поделать</label>
        <div id="todos-container">
        </div>
      </div>
      <button class="btn btn-save" id="save-btn" disabled>Сохранить изменения</button>
    </div>
    <a href="index.html" class="back-link" style="text-align: center; margin-top: 10px;">← На главную</a>
  </div>
</body>
<script src="/resources/edit_script.js"></script>
</html>
